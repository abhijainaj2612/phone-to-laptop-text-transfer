<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>PC Type Assistant</title>
  <link rel="stylesheet" href="style.css">
</head><body><main>
  <h1>PC TYPE ASSISTANT</h1>
  <section id="pair"><h2>Pair this phone</h2><p>Enter the six-digit code displayed by the PC client.</p>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="847291" aria-label="Pairing code">
    <button id="pairButton">PAIR PHONE</button>
  </section>
  <section id="send" hidden>
    <p id="connection" class="offline">● Checking PC…</p><label for="text">Paste text below:</label>
    <textarea id="text" maxlength="50000" placeholder="Paste text here…"></textarea>
    <div class="counts"><span id="characters">Characters: 0</span><span id="words">Words: 0</span></div>
    <div class="buttons"><button id="clear" class="secondary">CLEAR</button><button id="sendButton">SEND TO PC</button></div>
    <p id="status" aria-live="polite">Waiting…</p><button id="unpair" class="link">Disconnect this phone</button>
  </section>
</main><script src="config.js"></script><script src="app.js"></script></body></html>
